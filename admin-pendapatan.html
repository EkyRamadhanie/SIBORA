<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Pendapatan Admin - SIBORA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #ebf5ee;">

  <div class="dashboard-layout">
    
    <!-- Sidebar Kiri Admin -->
    <aside class="dashboard-sidebar">
      <a href="index.html" class="brand-logo">SIBORA</a>

      <nav class="sidebar-menu">
        <a href="admin-pendapatan.html" class="sidebar-link admin-active active">
          <span>📄</span> Pendapatan
        </a>
        <a href="admin-manajemen.html" class="sidebar-link">
          <span>👤</span> Manajemen
        </a>
      </nav>

      <div class="sidebar-bottom-links">
        <a href="index.html" class="sidebar-link">
          <span>🏠</span> Kembali ke Home
        </a>
        <a href="login.html" class="sidebar-link" id="btnSidebarLogout">
          <span>🚪</span> Logout
        </a>
      </div>
    </aside>

    <!-- Konten Kanan -->
    <main class="dashboard-main-content">
      
      <!-- Topbar Header -->
      <header class="dashboard-topbar" style="background-color: transparent; border: none; padding: 24px 36px 10px;">
        <div>
          <h1 style="font-size: 2rem; font-weight: 700; color: #143529;">Laporan Pendapatan</h1>
        </div>

        <div class="user-top-profile">
          <div class="user-text-right">
            <h4>Budi</h4>
            <p>Administrator</p>
          </div>
          <div class="user-big-avatar" style="background-color: #1b7a70;">
            👤
          </div>
        </div>
      </header>

      <!-- Body Section -->
      <div style="padding: 10px 36px 40px;">
        
        <!-- Controls Row -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap;">
          <div class="pengelola-search-bar" style="flex: 1; max-width: 440px;">
            <input type="text" placeholder="Search">
            <span class="search-icon-abs">🔍</span>
          </div>

          <div style="display: flex; gap: 12px;">
            <button type="button" class="btn-export-mint" style="padding: 8px 18px; font-weight: 600;">Bulan ini</button>
            <button type="button" class="btn-add-booking" onclick="window.print()">Export PDF</button>
          </div>
        </div>

        <!-- 3 Stat Summary Cards -->
        <div class="pengelola-stat-grid" style="margin-bottom: 24px;">
          
          <div class="pengelola-stat-card">
            <span style="font-size: 0.95rem; font-weight: 600; color: #333333;">Total Pendapatan</span>
            <h3 style="font-size: 2.6rem; font-weight: 800; color: #111111; margin-top: 6px;">Rp 48jt</h3>
          </div>

          <div class="pengelola-stat-card">
            <span style="font-size: 0.95rem; font-weight: 600; color: #333333;">Total Booking</span>
            <h3 style="font-size: 2.6rem; font-weight: 800; color: #111111; margin-top: 6px;">320</h3>
          </div>

          <div class="pengelola-stat-card">
            <span style="font-size: 0.95rem; font-weight: 600; color: #333333;">Pembatalan</span>
            <h3 style="font-size: 2.6rem; font-weight: 800; color: #111111; margin-top: 6px;">12</h3>
          </div>

        </div>

        <!-- Multi-line Comparison Chart 2024 vs 2025 -->
        <div class="chart-panel-card" style="padding: 24px; margin-bottom: 24px;">
          <div class="svg-chart-container">
            <svg viewBox="0 0 880 230" style="width: 100%; height: auto; min-width: 680px; display: block;" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <!-- Gradient Area Fill 2024 (Blue) -->
                <linearGradient id="grad2024" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
                  <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/>
                </linearGradient>

                <!-- Gradient Area Fill 2025 (Coral) -->
                <linearGradient id="grad2025" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#f87171" stop-opacity="0.32"/>
                  <stop offset="100%" stop-color="#f87171" stop-opacity="0.02"/>
                </linearGradient>
              </defs>

              <!-- Grid Horizontal Lines -->
              <line x1="60" y1="30" x2="850" y2="30" stroke="#f0f3f1" stroke-dasharray="3,3" stroke-width="1.2"/>
              <text x="35" y="34" font-size="11" fill="#718096" font-family="'Plus Jakarta Sans', sans-serif">40</text>

              <line x1="60" y1="95" x2="850" y2="95" stroke="#f0f3f1" stroke-dasharray="3,3" stroke-width="1.2"/>
              <text x="35" y="99" font-size="11" fill="#718096" font-family="'Plus Jakarta Sans', sans-serif">20</text>

              <line x1="60" y1="160" x2="850" y2="160" stroke="#f0f3f1" stroke-dasharray="3,3" stroke-width="1.2"/>
              <text x="40" y="164" font-size="11" fill="#718096" font-family="'Plus Jakarta Sans', sans-serif">0</text>

              <!-- Area Fill 2024 (Blue) -->
              <polygon points="
                80,130 148,130 216,130 284,115 352,130 420,80 488,95 556,102 624,106 692,120 760,120 828,95
                828,160 80,160
              " fill="url(#grad2024)"/>

              <!-- Area Fill 2025 (Coral) -->
              <polygon points="
                80,126 148,118 216,122 284,120 352,128 420,128 488,85 556,92 624,55 692,40 760,60 828,75
                828,160 80,160
              " fill="url(#grad2025)"/>

              <!-- Path Line 2024 (Blue/Purple) -->
              <polyline points="
                80,130 148,130 216,130 284,115 352,130 420,80 488,95 556,102 624,106 692,120 760,120 828,95
              " fill="none" stroke="#6366f1" stroke-width="2"/>

              <!-- Path Line 2025 (Coral/Red) -->
              <polyline points="
                80,126 148,118 216,122 284,120 352,128 420,128 488,85 556,92 624,55 692,40 760,60 828,75
              " fill="none" stroke="#f87171" stroke-width="2"/>

              <!-- Circles for 2024 -->
              <circle cx="80" cy="130" r="3.5" fill="#6366f1"/>
              <circle cx="216" cy="130" r="3.5" fill="#6366f1"/>
              <circle cx="284" cy="115" r="3.5" fill="#6366f1"/>
              <circle cx="352" cy="130" r="3.5" fill="#6366f1"/>
              <circle cx="420" cy="80" r="3.5" fill="#6366f1"/>
              <circle cx="488" cy="95" r="3.5" fill="#6366f1"/>
              <circle cx="556" cy="102" r="3.5" fill="#6366f1"/>
              <circle cx="624" cy="106" r="3.5" fill="#6366f1"/>
              <circle cx="692" cy="120" r="3.5" fill="#6366f1"/>
              <circle cx="760" cy="120" r="3.5" fill="#6366f1"/>
              <circle cx="828" cy="95" r="3.5" fill="#6366f1"/>

              <!-- Circles for 2025 -->
              <circle cx="80" cy="126" r="3.5" fill="#f87171"/>
              <circle cx="148" cy="118" r="3.5" fill="#f87171"/>
              <circle cx="284" cy="120" r="3.5" fill="#f87171"/>
              <circle cx="420" cy="128" r="3.5" fill="#f87171"/>
              <circle cx="488" cy="85" r="3.5" fill="#f87171"/>
              <circle cx="556" cy="92" r="3.5" fill="#f87171"/>
              <circle cx="624" cy="55" r="3.5" fill="#f87171"/>
              <circle cx="692" cy="40" r="3.5" fill="#f87171"/>
              <circle cx="760" cy="60" r="3.5" fill="#f87171"/>
              <circle cx="828" cy="75" r="3.5" fill="#f87171"/>

              <!-- X-Axis Labels (Months) -->
              <text x="80" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Januari</text>
              <text x="148" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Februari</text>
              <text x="216" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Maret</text>
              <text x="284" y="180" font-size="10" text-anchor="middle" fill="#4a5568">April</text>
              <text x="352" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Mei</text>
              <text x="420" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Juni</text>
              <text x="488" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Juli</text>
              <text x="556" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Agustus</text>
              <text x="624" y="180" font-size="10" text-anchor="middle" fill="#4a5568">September</text>
              <text x="692" y="180" font-size="10" text-anchor="middle" fill="#4a5568">November</text>
              <text x="760" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Oktober</text>
              <text x="828" y="180" font-size="10" text-anchor="middle" fill="#4a5568">Desember</text>

              <!-- Legend Center Bottom -->
              <g transform="translate(385, 206)">
                <!-- 2024 -->
                <line x1="0" y1="6" x2="16" y2="6" stroke="#6366f1" stroke-width="1.8"/>
                <circle cx="8" cy="6" r="3.2" fill="#6366f1"/>
                <text x="22" y="10" font-size="11" font-weight="600" fill="#4a5568">2024</text>

                <!-- 2025 -->
                <line x1="60" y1="6" x2="76" y2="6" stroke="#f87171" stroke-width="1.8"/>
                <circle cx="68" cy="6" r="3.2" fill="#f87171"/>
                <text x="82" y="10" font-size="11" font-weight="600" fill="#4a5568">2025</text>
              </g>
            </svg>
          </div>
        </div>

        <!-- Tabel Rekap Lapangan Admin -->
        <div class="pengelola-table-container admin-scroll-container">
          <table class="pengelola-data-table" style="width: 100%;">
            <thead>
              <tr>
                <th style="padding: 12px 24px; font-weight: 700; width: 40%; font-size: 0.95rem;">Lapangan</th>
                <th style="padding: 12px 24px; font-weight: 700; width: 30%; font-size: 0.95rem;">Booking</th>
                <th style="padding: 12px 24px; font-weight: 700; width: 30%; font-size: 0.95rem;">Pendapatan</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Futsal A</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">88</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Rp 13,2jt</td>
              </tr>
              <tr>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Futsal B</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">89</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Rp 13,2jt</td>
              </tr>
              <tr>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Futsal C</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">90</td>
                <td style="padding: 14px 24px; font-weight: 700; font-size: 0.95rem; color: #111111;">Rp 13,2jt</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
