<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIBORA - Sistem Booking Fasilitas Olahraga</title>
  <link rel="stylesheet" href="css/style.css?v=dashboard-history-v5">
</head>
<body>

  <!-- Header / Navigation Bar -->
  <header class="sibora-navbar">
    <a href="index.html" class="brand-logo">SIBORA</a>
    <div class="nav-group">
      <a href="login.html" class="nav-pill">Login</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="home-hero bg-sports-cover">
    <h1>Selamat Datang Di SIBORA</h1>
    <a href="jadwal.html" class="btn-hero-schedule">Cek Jadwal Sekarang</a>
  </section>

  <!-- 3 Main Categories Section -->
  <main class="home-categories-section">
    <div class="categories-grid">
      
      <!-- Lapangan -->
      <a href="lapangan.html" class="category-card" title="Lihat Lapangan">
        <div class="category-icon">
          <!-- Soccer Pitch Tactical Line Art -->
          <svg width="120" height="90" viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="130" height="90" rx="6" stroke="#144933" stroke-width="7"/>
            <line x1="70" y1="5" x2="70" y2="95" stroke="#144933" stroke-width="7"/>
            <circle cx="70" cy="50" r="19" stroke="#144933" stroke-width="7"/>
            <!-- Penalty Areas -->
            <rect x="5" y="24" width="22" height="52" stroke="#144933" stroke-width="7"/>
            <rect x="113" y="24" width="22" height="52" stroke="#144933" stroke-width="7"/>
          </svg>
        </div>
        <h3>Lapangan</h3>
      </a>

      <!-- Peralatan -->
      <a href="peralatan.html" class="category-card" title="Lihat Peralatan">
        <div class="category-icon">
          <!-- Soccer Ball Line Art / Icon -->
          <svg width="110" height="110" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" stroke="#144933" stroke-width="7"/>
            <!-- Center Pentagon -->
            <polygon points="50,30 65,42 59,59 41,59 35,42" fill="#144933"/>
            <!-- Connecting Lines -->
            <line x1="50" y1="30" x2="50" y2="7" stroke="#144933" stroke-width="6"/>
            <line x1="65" y1="42" x2="88" y2="34" stroke="#144933" stroke-width="6"/>
            <line x1="59" y1="59" x2="76" y2="82" stroke="#144933" stroke-width="6"/>
            <line x1="41" y1="59" x2="24" y2="82" stroke="#144933" stroke-width="6"/>
            <line x1="35" y1="42" x2="12" y2="34" stroke="#144933" stroke-width="6"/>
          </svg>
        </div>
        <h3>Peralatan</h3>
      </a>

      <!-- Fasilitas -->
      <a href="lapangan.html" class="category-card" title="Lihat Fasilitas">
        <div class="category-icon">
          <!-- Sports Hall & Basketball Hoop Line Art -->
          <svg width="120" height="110" viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Basketball on Roof -->
            <circle cx="60" cy="28" r="21" stroke="#144933" stroke-width="6"/>
            <path d="M42 22C48 27 52 35 52 45" stroke="#144933" stroke-width="5"/>
            <path d="M78 22C72 27 68 35 68 45" stroke="#144933" stroke-width="5"/>
            <line x1="39" y1="28" x2="81" y2="28" stroke="#144933" stroke-width="5"/>
            <!-- Building Structure -->
            <rect x="18" y="52" width="84" height="48" rx="2" stroke="#144933" stroke-width="6"/>
            <line x1="12" y1="52" x2="108" y2="52" stroke="#144933" stroke-width="6"/>
            <!-- Doors & Columns -->
            <rect x="28" y="66" width="14" height="34" stroke="#144933" stroke-width="5"/>
            <rect x="52" y="66" width="16" height="34" stroke="#144933" stroke-width="5"/>
            <rect x="78" y="66" width="14" height="34" stroke="#144933" stroke-width="5"/>
          </svg>
        </div>
        <h3>Fasilitas</h3>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="sibora-footer">
    Sistem Booking Fasilitas Olahraga - SIBORA 2026
  </footer>

  <script src="js/app.js?v=dashboard-history-v5"></script>
  <script src="js/sibora-api.js?v=dashboard-history-v5"></script>
  <script src="js/sibora-integration.js?v=dashboard-history-v5"></script>
  <script src="js/sibora-mvp.js?v=dashboard-history-v5"></script>
</body>
</html>
